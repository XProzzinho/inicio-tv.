name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon 2>&1 | tee build.log || {
            grep -E "^e: |error:" build.log | head -20 | sed 's/^/::error::/'
            exit 1
          }
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk inicio-tv.apk

      - name: Publicar versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Início TV v1.${{ github.run_number }}
          make_latest: "true"
          files: inicio-tv.apk
